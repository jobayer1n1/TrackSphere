{% extends "base.html" %}

{% block title %}TrackSphere - Portal Login{% endblock %}

{% block content %}
<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div class="card" style="max-width: 440px; width: 100%; padding: 2.5rem; position: relative;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div class="brand-logo" style="width: 50px; height: 50px; margin: 0 auto 1rem; font-size: 1.5rem;">🌐</div>
            <h1 style="font-size: 1.75rem; margin-bottom: 0.5rem;">TrackSphere</h1>
            <p style="color: var(--text-secondary); font-size: 0.9rem;">Fleet & Delivery Operations Portal</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Work Email</label>
                <input type="email" id="email" class="input-field" placeholder="name@tracksphere.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="input-field" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" id="btn-submit-login" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                Sign In to Platform
            </button>
        </form>

        <div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
            <p style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.75rem; text-align: center;">
                Quick Demo Auto-Fill
            </p>
            <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button type="button" class="btn btn-secondary btn-sm" onclick="autoFill('admin@tracksphere.com', 'admin123')" style="flex: 1;">
                    👑 Admin
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="autoFill('dispatcher@tracksphere.com', 'dispatch123')" style="flex: 1;">
                    🚚 Dispatcher
                </button>
                <button type="button" class="btn btn-secondary btn-sm" onclick="autoFill('driver.john@tracksphere.com', 'driver123')" style="flex: 1;">
                    🛣️ Driver
                </button>
            </div>
        </div>
    </div>
</div>

<script>
function autoFill(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
    showToast(`Loaded ${email}`, 'info');
}

async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (!res.ok) {
            const data = await res.json();
            throw new Error(data.detail || 'Login failed');
        }

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
            window.location.href = '/dashboard';
        }, 500);
    } catch (err) {
        showToast(err.message, 'error');
    }
}
</script>
{% endblock %}
